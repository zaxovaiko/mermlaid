name: Bug report
description: Something in Mermlaid does not work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the popover with Cmd+Shift+M
        2. Paste this diagram: ...
        3. Click Copy
    validations:
      required: true
  - type: textarea
    id: diagram
    attributes:
      label: Mermaid source (if relevant)
      render: text
  - type: input
    id: version
    attributes:
      label: Mermlaid version
      placeholder: "0.1.0, or the commit you built from"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15.2 / Ubuntu 24.04 / Windows 11"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, console output, or notes.
